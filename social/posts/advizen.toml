slug     = "advizen"
category = "О фирме"
title    = "Advizen"
deck     = "Консалтинг и операции — в одной практике, по одному договору"
image    = "public/social/source/advizen/01-cover.jpg"

# Four slides, not six, and in the order of an argument rather than of a
# catalogue: the problem, the answer, the proof. Six self-contained
# assertions could be shuffled without loss, which is the definition of a
# list — and a list is what a profile post defaults to unless something
# stops it.

[[slide]]                       # the problem
type = "scene"
eyebrow = "Почему это вообще вопрос"
image = "public/social/source/advizen/05-consequence.jpg"
title = "Вопрос из одной области почти никогда в ней не остаётся"
caption = "Структура сделки меняет налог. Налог меняет трудовой договор. Договор меняет отчётность."

[[slide]]                       # the answer
type = "matrix"
eyebrow = "Практика"
columns = [
  { name = "Консалтинг", items = [
      "Налоги",
      "Право",
      "Бухгалтерский учёт",
      "HR",
      "Финансирование и гранты",
      "M&A",
      "Due diligence",
  ] },
  { name = "Операции", items = [
      "Управление компаниями",
      "Корпоративные услуги",
      "Employer of Record",
      "Payroll-бюро",
      "Разрешения на работу",
      "Виртуальный офис",
      "Мониторинг комплаенса",
  ] },
]

[[slide]]                       # the proof
type = "figures"
eyebrow = "Послужной список"
image = "public/social/source/advizen/04-record.jpg"
rows = [
  { value = "$10 млрд+", label = "в сделках, сопровождённых членами команды" },
  { value = "80+",       label = "регистраций компаний" },
  { value = "30+",       label = "проведённых due diligence" },
]
